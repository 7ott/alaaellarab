<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.jpg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2A2927">
<link rel="apple-touch-icon" href="icon-192.png">
<title>علاء العراب | تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: charcoal brand band with the Al-Arrab shield, then quick-add form, demand by area, request log */
:root{
  --bg:#F2F0EC; --surface:#FFFFFF; --line:#DDD8CF; --ink:#1E1C1A; --muted:#6B655C;
  --accent:#9A7433; --accent-ink:#FFFFFF; --accent-soft:#F1E6CF;
  --band:#2A2927; --band-2:#3A3835; --gold:#D4AF6A; --gold-hi:#F0D79A; --band-ink:#E9E3D8;
  --due:#B26A00; --due-soft:#FBEBD0; --late:#B42318; --late-soft:#FBE1DE; --ok:#1F7A3D; --ok-soft:#DCF2E2;
  --f-name:"Aref Ruqaa","Reem Kufi",serif;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
.brand{background:linear-gradient(135deg,var(--band-2),var(--band));color:var(--band-ink);border-radius:14px;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.brand img{width:88px;height:auto;border-radius:10px;flex:none}
.brand .who{flex:1 1 220px;min-width:0}
.brand .name{font-family:var(--f-name);font-weight:700;font-size:clamp(32px,6vw,44px);line-height:1.15;margin:0;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#A8823F);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .tool{font-family:var(--f-body);font-weight:600;color:var(--gold);font-size:16px;margin:2px 0 0}
.brand .sub{color:color-mix(in srgb,var(--band-ink) 75%,transparent)}
.brand .msg{color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:3px 12px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);margin:0;line-height:1.2;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
h2{font-family:var(--f-body);font-weight:700;font-size:18px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.stat small{color:var(--muted);font-size:12.5px}
.stat.warn b{color:var(--due)}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
form{display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid .wide{grid-column:span 2}
.grid .full{grid-column:1/-1}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid .wide{grid-column:1/-1}}
label{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=url]{direction:ltr;text-align:left}
textarea{resize:vertical;min-height:42px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px;font-weight:500}
.btn.danger{border-color:var(--late);color:var(--late);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13.5px;color:var(--muted)}
.msg.err{color:var(--late)}
.two{display:grid;grid-template-columns:3fr 2fr;gap:20px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.bars{display:grid;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) 1fr 34px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:6px}
.bar .n{font-variant-numeric:tabular-nums;text-align:left;color:var(--muted)}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-note{color:var(--muted);font-size:14px;margin:10px 0 0}
.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:760px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .q{grid-column:1/-1}}
.list{display:grid;gap:10px;margin-top:14px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;background:var(--surface)}
.item.late{border-inline-start:4px solid var(--late)}
.item.due{border-inline-start:4px solid var(--due)}
.top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.title{font-weight:700;font-size:16px}
.tag{font-size:12.5px;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--ink)}
.tag.late{background:var(--late-soft);color:var(--late)}
.tag.due{background:var(--due-soft);color:var(--due)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.ex{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.meta{color:var(--muted);font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 14px}
.note{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl select,.ctrl input{width:auto;padding:4px 8px;font-size:13.5px}
.ctrl a{color:var(--accent);font-weight:600;font-size:14px}
.budget{font-variant-numeric:tabular-nums;font-weight:600}
.paste textarea{min-height:84px;border-style:dashed;border-color:var(--accent);background:var(--surface)}
#pasteHits .chip{cursor:default;background:var(--accent-soft);border-color:transparent;font-size:12.5px}
.filled{outline:2px solid var(--gold);outline-offset:1px;transition:outline-color 1.5s}
.banner{background:var(--due-soft);color:var(--ink);border-radius:8px;padding:10px 14px;font-size:14px}
@media (prefers-reduced-motion:no-preference){.bar .fill{transition:width .4s ease}}

.gate{min-height:100vh;display:grid;place-content:center;justify-items:center;gap:10px;padding:24px 16px;text-align:center;background:linear-gradient(135deg,var(--band-2),var(--band));color:var(--band-ink)}
.gate img{border-radius:12px;max-width:120px}
.gate .gname{font-family:var(--f-name);font-size:42px;margin:6px 0 0;color:var(--gold)}
.gate p{margin:0}
.gate .msg{color:var(--gold-hi)}
.gate-form{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(420px,100%)}
.gate-form input{flex:1 1 100%;background:#fff;color:#1E1C1A}
</style>
</head>
<body>
<main class="gate" id="gate">
  <img src="logo.jpg" alt="شعار العراب" width="120">
  <h1 class="gname">علاء العراب</h1>
  <p>رادار الطلبات العقارية</p>
  <form id="loginForm" class="gate-form">
    <input id="loginEmail" type="email" required placeholder="الإيميل" autocomplete="username" dir="ltr">
    <input id="loginPass" type="password" required placeholder="كلمة السر" autocomplete="current-password" dir="ltr">
    <button class="btn" id="loginBtn" type="submit">دخول</button>
  </form>
  <p class="msg" id="gateMsg" role="status"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://vyztsyahxjvlisqwgvvc.supabase.co";        // مثل https://abcd1234.supabase.co
const SUPABASE_ANON_KEY = "sb_publishable_Jqec3ItuA5XpEG6l2jrWmQ_-u8ba5Bf";      // المفتاح anon / publishable — مش service_role أبدًا

(function(){
  const $ = id => document.getElementById(id);
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // لو داخل قبل كده، روح للسيستم على طول
  sb.auth.getSession().then(({ data }) => { if (data.session) location.replace("app.html" + location.search); });
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("loginBtn").disabled = true; $("loginBtn").textContent = "جاري الدخول…"; $("gateMsg").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email: $("loginEmail").value.trim(), password: $("loginPass").value });
    if (!error) { location.replace("app.html" + location.search); return; }
    $("loginBtn").disabled = false; $("loginBtn").textContent = "دخول";
    const m = (error.message || "").toLowerCase();
    let t = "حصل خطأ: " + (error.message || "غير معروف");
    if (m.includes("invalid login") || m.includes("credentials")) t = "الإيميل أو كلمة السر غلط.";
    else if (m.includes("not confirmed")) t = "الحساب مش متأكد. من Supabase ← Users افتح المستخدم واعمله Confirm.";
    else if (m.includes("rate") || error.status === 429) t = "محاولات كتير ورا بعض. استنى دقيقة وجرّب تاني.";
    $("gateMsg").textContent = t; $("gateMsg").className = "msg err";
  });
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
</body>
</html>
