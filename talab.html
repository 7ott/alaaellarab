<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اطلب أو اعرض عقارك | العراب للتسويق العقاري</title>
<meta name="description" content="عايز تشتري أو تبيع عقار في بني سويف شرق النيل؟ سيب بياناتك وفريق العراب يكلمك.">
<meta property="og:title" content="اشتري أو بيع عقارك في بني سويف شرق النيل — العراب">
<meta property="og:description" content="سيب طلبك في دقيقة، وإحنا نكلمك.">
<meta property="og:image" content="logo.jpg">
<meta name="theme-color" content="#2A2927">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: charcoal brand band with the shield, then one short form card that overlaps it */
:root{
  --bg:#F2F0EC; --surface:#FFFFFF; --line:#DDD8CF; --ink:#1E1C1A; --muted:#6B655C;
  --accent:#9A7433; --accent-ink:#FFFFFF; --accent-soft:#F1E6CF;
  --band:#2A2927; --band-2:#3A3835; --gold:#D4AF6A; --gold-hi:#F0D79A; --band-ink:#E9E3D8;
  --err:#B42318; --ok:#1F7A3D;
  --f-name:"Aref Ruqaa",serif; --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.hero{background:linear-gradient(135deg,var(--band-2),var(--band));color:var(--band-ink);padding:28px 16px 84px;text-align:center}
.hero img{width:96px;border-radius:12px}
.hero h1{font-family:var(--f-name);font-size:clamp(30px,7vw,42px);margin:8px 0 0;line-height:1.2;color:var(--gold)}
.hero p{margin:6px auto 0;max-width:34ch;color:color-mix(in srgb,var(--band-ink) 85%,transparent)}
main{max-width:560px;margin:-60px auto 40px;padding-inline:12px}
@media (max-width:420px){.card{padding:16px}.hero{padding:22px 16px 76px}.hero img{width:80px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 10px 30px rgba(20,18,15,.08)}
form{display:grid;gap:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
label{display:grid;gap:5px;font-size:14px;font-weight:600;min-width:0}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input[type=tel]{direction:ltr;text-align:right}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:6px;min-width:0}
legend{font-size:14px;font-weight:600;padding:0;margin-bottom:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg label{position:relative;display:block}
.seg input{position:absolute;top:0;right:0;width:1px;height:1px;margin:0;padding:0;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 6px;cursor:pointer;font-weight:500;font-size:15px}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;color:var(--muted)}
.consent input{width:20px;height:20px;flex:none;margin-top:3px}
.btn{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.msg{font-size:14px;margin:0;min-height:1.4em}
.msg.err{color:var(--err)}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
html,body{overflow-x:hidden}
.done{text-align:center;padding:12px 4px;display:grid;gap:8px;justify-items:center}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:30px;font-weight:700}
.done h2{margin:0;font-size:22px}
.done p{margin:0;color:var(--muted);max-width:32ch}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 28px}

/* ===== PC: brand half + form half, fills the screen ===== */
@media (min-width:900px){
  body{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto;min-height:100vh}
  .hero{grid-row:1/span 2;display:grid;place-content:center;justify-items:center;padding:48px 40px;position:sticky;top:0;height:100vh}
  .hero img{width:150px}
  .hero h1{font-size:52px}
  .hero p{font-size:18px;max-width:30ch}
  main{margin:0;padding:48px clamp(24px,4vw,64px) 16px;max-width:none;display:grid;align-content:center}
  .card{max-width:600px;width:100%;margin-inline:auto;box-shadow:none}
  footer{grid-column:2;padding-bottom:20px}
}
#areaOther{margin-top:6px}
select:invalid{color:var(--muted)}
select option{color:var(--ink)}
</style>
</head>
<body>
<header class="hero">
  <img src="logo.jpg" alt="شعار العراب للتسويق العقاري" width="96" height="110">
  <h1>اشتري أو بيع عقارك</h1>
  <p>بتدور على عقار تمليك في بني سويف شرق النيل، أو عندك عقار هناك عايز تبيعه؟ سيب بياناتك وإحنا نكلمك.</p>
</header>

<main>
  <div class="card">
    <form id="f" novalidate>
      <div class="row">
        <label>الاسم
          <input id="name" required maxlength="60" autocomplete="name" placeholder="اسمك">
        </label>
        <label>رقم الموبايل / واتساب
          <input id="phone" type="tel" required inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx" maxlength="16">
        </label>
      </div>

      <fieldset>
        <legend>أنا</legend>
        <div class="seg">
          <label><input type="radio" name="purpose" value="شراء" checked><span>عايز أشتري</span></label>
          <label><input type="radio" name="purpose" value="تسويق"><span>عندي عقار للبيع</span></label>
        </div>
      </fieldset>

      <div class="row">
        <label>نوع العقار
          <select id="type" required>
            <option value="" disabled selected>اختار من هنا</option><option>شقة</option><option>أرض</option><option>فيلا</option>
          </select>
        </label>
        <label>الحي <small>(بني سويف شرق النيل)</small>
          <select id="area" required>
            <option value="" disabled selected>اختار من هنا</option><option>الحي الأول</option><option>الحي الثالث</option><option>الحي الرابع</option><option>حي الأزهر</option><option>الحي الخامس</option><option>الحي السابع</option><option>الحي الثامن</option><option>الحي العاشر</option><option>الحي 11</option><option>الحي 12</option><option>الحي 13</option><option>مسلسل 1</option><option>مسلسل 3</option><option value="__other">حي تاني…</option>
          </select>
          <input id="areaOther" maxlength="40" placeholder="اكتب اسم الحي أو المنطقة" hidden>
        </label>
      </div>

      <div class="row">
        <label><span id="budgetLabel">الميزانية</span> <small>(تقريبًا)</small>
          <input id="budget" inputmode="decimal" maxlength="20" placeholder="مثلًا 1.5 مليون">
        </label>
        <fieldset>
          <legend>طريقة الدفع</legend>
          <div class="seg">
            <label><input type="radio" name="pay" value="كاش"><span>كاش</span></label>
            <label><input type="radio" name="pay" value="تقسيط"><span>تقسيط</span></label>
          </div>
        </fieldset>
      </div>

      <label>تفاصيل تانية <small>(اختياري)</small>
        <textarea id="note" rows="3" maxlength="500" placeholder="المساحة، عدد الغرف، الدور، رقم القطعة أو المجاورة…"></textarea>
      </label>

      <label class="hp" aria-hidden="true">سيبها فاضية<input id="website" tabindex="-1" autocomplete="off"></label>

      <label class="consent"><input type="checkbox" id="ok" required> أوافق إن فريق العراب يتواصل معايا على الرقم ده بخصوص طلبي.</label>

      <button class="btn" id="send" type="submit">ابعت طلبي</button>
      <p class="msg" id="msg" role="status"></p>
    </form>

    <div class="done" id="done" hidden>
      <div class="tick" aria-hidden="true">✓</div>
      <h2>طلبك وصلنا</h2>
      <p id="doneText">هندور على المتاح اللي يناسبك ونكلمك على رقمك في أقرب وقت.</p>
      <button class="link" id="again" type="button">عندي طلب تاني</button>
    </div>
  </div>
</main>
<footer>العراب للتسويق العقاري · تمليك فقط · بني سويف شرق النيل</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://vyztsyahxjvlisqwgvvc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Jqec3ItuA5XpEG6l2jrWmQ_-u8ba5Bf";
(function(){
  const $ = id => document.getElementById(id);
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
  const digits = s => String(s||"").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d+]/g, "");
  function normPhone(s){
    let p = digits(s);
    if (p.startsWith("+20")) p = "0" + p.slice(3); else if (p.startsWith("0020")) p = "0" + p.slice(4); else if (p.startsWith("20") && p.length === 12) p = "0" + p.slice(2);
    return /^01[0125]\d{8}$/.test(p) ? p : null;
  }
  function parseBudget(s){
    s = String(s||"").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[,،\s]/g, "");
    if (!s) return null;
    let m = 1;
    if (/مليون|م$/.test(s)) { m = 1e6; s = s.replace(/مليون|م$/g, ""); }
    else if (/الف|ألف|ك$/.test(s)) { m = 1e3; s = s.replace(/الف|ألف|ك$/g, ""); }
    const n = parseFloat(s.replace("٫", ".")); if (!isFinite(n)) return null;
    let v = n * m; if (m === 1 && v < 100) v *= 1e6;
    return Math.round(v);
  }
  const isOwner = () => document.querySelector('input[name=purpose]:checked').value === "تسويق";
  document.querySelectorAll('input[name=purpose]').forEach(r => r.addEventListener("change", () => {
    $("budgetLabel").textContent = isOwner() ? "السعر المطلوب" : "الميزانية";
  }));
  $("area").addEventListener("change", () => { $("areaOther").hidden = $("area").value !== "__other"; if (!$("areaOther").hidden) $("areaOther").focus(); });
  const say = (t, err) => { $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); };
  let lastSent = 0;

  $("f").addEventListener("submit", async e => {
    e.preventDefault();
    if ($("website").value) return; // bot
    const name = $("name").value.trim(), phone = normPhone($("phone").value);
    if (!name) return say("اكتب اسمك", true);
    if (!phone) return say("اكتب رقم موبايل مصري صحيح، 11 رقم ويبدأ بـ 01", true);
    if (!$("type").value) { $("type").focus(); return say("اختار نوع العقار", true); }
    if (!$("area").value) { $("area").focus(); return say("اختار الحي", true); }
    if ($("area").value === "__other" && !$("areaOther").value.trim()) { $("areaOther").focus(); return say("اكتب اسم الحي", true); }
    if (!$("ok").checked) return say("لازم توافق إننا نتواصل معاك عشان نقدر نرد على طلبك", true);
    if (Date.now() - lastSent < 30000) return say("طلبك اتبعت بالفعل، استنى شوية لو عايز تبعت تاني", true);
    const pay = (document.querySelector('input[name=pay]:checked') || {}).value || "";
    const row = {
      name, phone,
      purpose: document.querySelector('input[name=purpose]:checked').value,
      type: $("type").value, area: $("area").value === "__other" ? ("شرق النيل - " + ($("areaOther").value.trim() || "غير محدد")) : $("area").value,
      budget: parseBudget($("budget").value), pay,
      note: $("note").value.trim().slice(0, 500),
      source: "صفحة اطلب عقارك", status: "new"
    };
    $("send").disabled = true; $("send").textContent = "جاري الإرسال…"; say("");
    const { error } = await sb.from("requests").insert(row);
    $("send").disabled = false; $("send").textContent = "ابعت طلبي";
    if (error) return say("الطلب ما اتبعتش، جرّب تاني بعد شوية.", true);
    lastSent = Date.now();
    $("doneText").textContent = row.purpose === "تسويق" ? "هنراجع بيانات عقارك ونكلمك على رقمك عشان نتفق على التسويق." : "هندور على المتاح اللي يناسبك ونكلمك على رقمك في أقرب وقت.";
    $("f").hidden = true; $("done").hidden = false; $("done").querySelector("h2").focus?.();
  });
  $("again").onclick = () => {
    ["budget","note"].forEach(id => $(id).value = "");
    $("done").hidden = true; $("f").hidden = false; say("");
  };
})();
</script>
</body>
</html>
